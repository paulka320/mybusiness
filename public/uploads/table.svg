<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <!-- Table Top -->
  <ellipse cx="200" cy="180" rx="140" ry="50" fill="url(#wood)" stroke="#78350f" stroke-width="4"/>
  <!-- Table Legs -->
  <line x1="120" y1="210" x2="100" y2="320" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="280" y1="210" x2="300" y2="320" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="225" x2="170" y2="330" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="225" x2="230" y2="330" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <text x="200" y="370" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Modern Coffee Table</text>
</svg>
