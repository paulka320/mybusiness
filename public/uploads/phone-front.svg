<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f1f5f9"/>
  <!-- Phone Body -->
  <rect x="120" y="40" width="160" height="320" rx="30" fill="url(#bg)" stroke="#94a3b8" stroke-width="4"/>
  <!-- Screen -->
  <rect x="130" y="55" width="140" height="290" rx="20" fill="url(#screen)"/>
  <!-- Notch/Dynamic Island -->
  <rect x="165" y="65" width="70" height="18" rx="9" fill="#0f172a"/>
  <!-- Label -->
  <text x="200" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">iPhone 13 Pro</text>
  <text x="200" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Front View</text>
</svg>
